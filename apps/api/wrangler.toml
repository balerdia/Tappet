name = "tappet"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tappet"
# Replace with the id from `wrangler d1 create tappet`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/db/migrations"

[vars]
TAPPET_DEV_AUTH = "0"
# Comma-separated origins allowed to issue sign-in tokens, e.g. "https://app.example.com".
CLERK_AUTHORIZED_PARTIES = ""
# The secret key is not a var: run `wrangler secret put CLERK_SECRET_KEY`.
