name = "tappet"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tappet"
# Replace with the id from `wrangler d1 create tappet`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/db/migrations"

[vars]
TAPPET_DEV_AUTH = "0"
# Secrets, set with `wrangler secret put <NAME>`:
#   CLERK_SECRET_KEY, CREDENTIALS_KEY, LINEAR_CLIENT_ID, LINEAR_CLIENT_SECRET
# and APP_URL (your public address) as a var or secret.

[triggers]
crons = ["* * * * *"]
